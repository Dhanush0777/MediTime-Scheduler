# MediTime Application Properties
spring.application.name=meditime-scheduler
server.port=8080

# Profile Configuration (Default uses H2 file/mem with MySQL mode for instant out-of-the-box run, easily switchable to MySQL)
spring.profiles.active=default

# Database Configuration (H2 in MySQL compatibility mode by default for zero-setup demo, easily overridden by mysql profile)
spring.datasource.url=jdbc:h2:file:./data/meditime;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart / File upload (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.medtime=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
