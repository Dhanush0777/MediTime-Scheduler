<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Patients Directory – MediTime</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-users text-primary me-2"></i> Patient Directory</h2>
                <p class="text-muted mb-0">View registered patients, prescriptions, and adherence compliance.</p>
            </div>
            <a th:href="@{/doctor/prescriptions/new}" class="btn btn-primary shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> New Prescription
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Patient</th>
                            <th>Contact & Email</th>
                            <th>Demographics</th>
                            <th>Prescriptions</th>
                            <th>Adherence Rate</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${patients}">
                            <td>
                                <div class="fw-bold text-dark" th:text="${p.name}">Rahul Sharma</div>
                                <span class="badge bg-light text-secondary border" th:text="'Patient ID: #' + ${p.id}">Patient ID: #1</span>
                            </td>
                            <td>
                                <div th:text="${p.email}">rahul@meditime.com</div>
                                <span class="text-muted small" th:text="${p.phone}">+91 98765 12345</span>
                            </td>
                            <td>
                                <div class="small">
                                    <span th:text="${p.gender}">Male</span>,
                                    <span th:text="${p.age} + ' yrs'">29 yrs</span>
                                </div>
                                <span class="badge bg-danger-subtle text-danger border border-danger-subtle small" th:text="'Blood: ' + ${p.bloodGroup}">Blood: B+</span>
                            </td>
                            <td>
                                <span class="badge bg-teal-subtle text-primary border border-primary-subtle fs-6" th:text="${p.totalPrescriptions} + ' Active'">1 Active</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="progress flex-grow-1" style="height: 8px;">
                                        <div class="progress-bar bg-success" role="progressbar" th:style="'width: ' + ${p.overallAdherence} + '%'"></div>
                                    </div>
                                    <span class="fw-bold small" th:text="${p.overallAdherence} + '%'">85%</span>
                                </div>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/doctor/patients/{id}/history(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fa-solid fa-clock-rotate-left me-1"></i> Medication History
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
